openapi: 3.1.0
info:
  title: Starry Auth and Member API - candidate, NOT DEPLOYED
  version: 0.1.0-draft
servers: []
paths:
  /v1/auth/oidc/exchange:
    post:
      summary: Candidate OIDC authorization code + PKCE exchange, signature verified by backend
      responses:
        '501': {description: Not implemented}
  /v1/auth/session:
    get:
      summary: Candidate current Starry session introspection
      security: [{StarrySession: []}]
      responses:
        '501': {description: Not implemented}
  /v1/auth/logout:
    post:
      summary: Candidate Starry session revocation
      security: [{StarrySession: []}]
      responses:
        '501': {description: Not implemented}
  /v1/members/me:
    get:
      summary: Candidate self-only member profile
      security: [{StarrySession: []}]
      responses:
        '501': {description: Not implemented}
components:
  securitySchemes:
    StarrySession: {type: http, scheme: bearer}
  schemas:
    AdminContext:
      type: object
      required: [brand_id, app_id, environment, resource, action]
      additionalProperties: false
      properties:
        brand_id: {type: string, const: starry}
        app_id: {type: string}
        environment: {type: string, enum: [development, staging, production]}
        resource: {type: string}
        action: {type: string, enum: [read, write, approve, refund, deploy, export, restore]}
