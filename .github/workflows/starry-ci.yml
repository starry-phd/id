name: Starry CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Never expose deployment credentials or write permission to untrusted PR code.
permissions:
  contents: read

concurrency:
  group: starry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-validation:
    name: Required validation
    if: always()
    needs: [repository-policy, app-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped validation
        env:
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          APP_RESULT: ${{ needs.app-tests.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$APP_RESULT" = success

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_ready: ${{ steps.app.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Starry repo policy and tracked file names
        run: python3 scripts/ci/validate_repository.py
      - name: Detect actual app test scaffold
        id: app
        shell: bash
        run: |
          if test -f package.json && test -f package-lock.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "App code/tests not initialized; repository policy PASS is NOT app-test PASS."
          fi

  app-tests:
    name: App typecheck, lint and tests
    needs: repository-policy
    if: needs.repository-policy.outputs.app_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require actual quality scripts
        run: |
          node -e 'const s=require("./package.json").scripts||{}; for(const k of ["typecheck","lint","test"]) if(!s[k]) throw Error("Missing "+k)'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run auth:typecheck
      - run: npm run w3:typecheck
      - run: npm run auth:test
      - run: npm run mobile:config
      - run: npm run api:check
      - run: npm run release:blocked
      - run: npm run promotion:verify

# Staging deployment intentionally OMITTED from this curated promotion.
# AI-0 must review real resource mapping, Gates, production permissions,
# then create a separate controlled deploy PR; never deploy on push to main.
