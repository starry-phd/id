name: AI-0 Current Complete Offline Integration Gate (release BLOCKED)
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'modules/**'
      - 'packages/**'
      - 'docs/requirements/**'
      - 'docs/release-readiness/**'
      - 'docs/api-handoff/**'
      - 'docs/contracts/**'
      - 'docs/adr/**'
      - 'docs/operations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai0-current-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  four-owner-current-same-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies, source inventory, PR policy and blocked release Gate
        run: |
          npm ci --no-audit --no-fund
          npm run ssot:validate
          node docs/requirements/verify-original-inventory.mjs
          node docs/requirements/verify-source-reconciliation-r8.mjs
          node docs/release-readiness/check-release-readiness.mjs --assert-blocked
          node docs/operations/verify-ci-consolidation.mjs
          node --test docs/release-readiness/test/*.test.mjs
          node docs/api-handoff/verify-api-surface.mjs
          node --test docs/api-handoff/test/*.test.mjs
          node --test apps/api/test/round6-governance.test.mjs
      - name: Root TypeScript, lint, Expo mobile config, API dry-run (no deploy)
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run mobile:config
          npm run api:check
      - name: All four owner TypeScript plus Node security and integration tests
        run: |
          ./node_modules/.bin/tsc -p modules/starry-id-v1/tsconfig.json --noEmit
          ./node_modules/.bin/tsc -p tsconfig.rebuild-billing.json --noEmit
          ./node_modules/.bin/tsc -p packages/rebuild-ai3/tsconfig.json --noEmit
          node --experimental-strip-types --test modules/starry-id-v1/test/*.test.mjs
          node --experimental-strip-types --test packages/rebuild-billing/test/*.test.mjs
          node --experimental-strip-types --test packages/rebuild-ai3/test/*.test.mjs
          node --experimental-strip-types --test packages/ai0-contracts/test/*.test.mjs
          node --experimental-strip-types --test packages/integration/test/*.test.mjs
          node --experimental-strip-types --test packages/rebuild-ai3/integration/round5-billing-committed.test.mjs
      - name: SQLite in-memory migrations, failure, CAS and recovery tests
        run: |
          python3 -m unittest discover -s modules/starry-id-v1/test -p 'test_*.py' -v
          python3 -m unittest discover -s packages/rebuild-billing/test -p 'test_*.py' -v
          python3 -m unittest discover -s packages/rebuild-ai3/test -p 'test_*.py' -v
      # Deliberately NO real OAuth/Store, live D1/Queue, deploy, EAS Build,
      # updates, paid services, secrets or main branch merging.
