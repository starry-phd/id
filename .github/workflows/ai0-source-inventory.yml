name: AI-0 Original Requirements Source Index
on:
  pull_request:
    paths:
      - 'docs/requirements/original-inventory.v0.json'
      - 'docs/requirements/verify-original-inventory.mjs'
      - '.github/workflows/ai0-source-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source ID uniqueness and counts
        run: node docs/requirements/verify-original-inventory.mjs
