name: AI-3 Trust Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ai3/**'
      - '.github/workflows/ai3-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai3-contracts:
    name: AI-3 unit and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict TypeScript typecheck
        run: npm exec --yes --package=typescript@5.8.3 -- tsc -p packages/ai3/tsconfig.json --noEmit
      - name: Check actual pinned AI-0 canonical source parity
        run: |
          git fetch --no-tags --depth=1 origin f1ee45098097cb511b4a0fa656bc3503a79c21c0
          git show f1ee45098097cb511b4a0fa656bc3503a79c21c0:packages/contracts/src/index.ts > "$RUNNER_TEMP/ai0-canonical.ts"
          git fetch --no-tags --depth=1 origin 381b18f2eebb19fb9402fd50cd7169667df0e0f9
          git show 381b18f2eebb19fb9402fd50cd7169667df0e0f9:modules/starry-auth/src/guards.ts > "$RUNNER_TEMP/ai1-guards.ts"
          git fetch --no-tags --depth=1 origin 69b5283e93dc29036d2d47ab5af28f994bbd62d1
          git show 69b5283e93dc29036d2d47ab5af28f994bbd62d1:packages/billing-contracts/src/index.ts > "$RUNNER_TEMP/ai2-billing.ts"
      - name: Syntax check and unit test (no npm dependencies)
        env:
          AI0_CANONICAL_MODULE: ${{ runner.temp }}/ai0-canonical.ts
          AI1_GUARDS_MODULE: ${{ runner.temp }}/ai1-guards.ts
          AI2_BILLING_MODULE: ${{ runner.temp }}/ai2-billing.ts
        run: |
          node --experimental-strip-types --check packages/ai3/src/index.ts
          node --experimental-strip-types --test packages/ai3/test/*.test.mjs
      - name: Validate isolated D1 schema draft using SQLite in-memory only
        run: |
          python3 - <<'PY'
          import sqlite3
          with open('packages/ai3/schema/001_audit_design.sql',encoding='utf-8') as f:
              migration=f.read()
          conn=sqlite3.connect(':memory:')
          conn.executescript(migration)
          assert {'ai3_audit_events','ai3_delivery_dedupe'}.issubset({r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")})
          PY
      - name: AI-3 in-memory billing audit uniqueness tests
        run: python3 -m unittest discover -s packages/ai3/test -p 'test_*.py' -v
