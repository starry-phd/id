name: Production probe

# Spec S-PLT-07: external health check every 15 minutes. One issue per outage
# (GitHub emails the owner when it opens and when it closes on recovery), so a
# long outage produces one alert, not one per run. Does nothing until the Deploy
# workflow has deployed production at least once.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      URL: https://id.starry.phd/v1/health
      TITLE: 'Production health check failing: id.starry.phd'
    steps:
      - name: Skip until production has been deployed
        id: gate
        run: |
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].id' || true)
          for id in $run; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.jobs[] | select(.name=="production") | .conclusion' | grep -q success; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Production not deployed yet; probe skipped."
      - name: Check health
        id: check
        if: steps.gate.outputs.deployed == 'true'
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 10 "$URL" | grep -q '"status":"ok"'; then echo "healthy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
      - name: Open or close the outage issue
        if: steps.gate.outputs.deployed == 'true'
        run: |
          open=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=outage&per_page=1" --jq '.[0].number // empty')
          now=$(date -u +%Y-%m-%dT%H:%MZ)
          if [ "${{ steps.check.outputs.healthy }}" = "true" ]; then
            if [ -n "$open" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${open}/comments" -f body="Recovered at ${now}. ${URL} answers ok." >/dev/null
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${open}" -f state=closed >/dev/null
            fi
          elif [ -z "$open" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$TITLE" -f body="Detected at ${now}: ${URL} did not answer ok three times in a row. Check Workers Observability logs and the latest Deploy run. This issue closes automatically when the check passes again." -f "labels[]=outage" >/dev/null
            exit 1
          else
            exit 1
          fi
