name: Deploy

# main -> staging (migrate, deploy, smoke) -> production (migrate, deploy, smoke, roll back on failure).
# Runs only when the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist;
# without them every step is skipped and the run stays green.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured; deployment skipped."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.gate.outputs.enabled == 'true'
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Apply D1 migrations (staging)
        if: steps.gate.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply starry-identity-staging --remote --env staging
      - name: Deploy Worker (staging)
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npx wrangler deploy --env staging | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test (staging)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/v1/health" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          exit 1

  production:
    needs: staging
    if: needs.staging.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply starry-identity --remote
      - name: Deploy Worker (production)
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test (production), roll back on failure
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://id.starry.phd/v1/health" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "::error::Production smoke test failed; rolling back to the previous version."
          npx wrangler rollback --message "smoke test failed for ${GITHUB_SHA}" -y
          exit 1
