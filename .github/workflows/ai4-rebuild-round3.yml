name: AI-4 Rebuild Round3 Worker SDK Expo Integration
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/sdk/**'
      - '.github/workflows/ai4-rebuild-round3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked workspace installation
        run: npm ci --no-audit --no-fund
      - name: AI-4 Worker SDK Expo
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run mobile:config
          npm run api:check
      - name: All latest owner strict TypeScript
        run: |
          ./node_modules/.bin/tsc --noEmit -p modules/starry-id-v1/tsconfig.json
          ./node_modules/.bin/tsc --noEmit -p tsconfig.rebuild-billing.json
          ./node_modules/.bin/tsc --noEmit -p packages/rebuild-ai3/tsconfig.json
      - name: Latest AI1 AI2 AI3 and cross-owner Node suites
        run: |
          node --experimental-strip-types --test modules/starry-id-v1/test/*.test.mjs
          node --experimental-strip-types --test packages/rebuild-billing/test/*.test.mjs
          node --experimental-strip-types --test packages/rebuild-ai3/test/*.test.mjs
          node --experimental-strip-types --test packages/integration/test/*.test.mjs
      - name: Domain SQLite-in-memory negative/CAS
        run: |
          python3 -m unittest discover -s modules/starry-id-v1/test -p 'test_*.py' -v
          python3 -m unittest discover -s packages/rebuild-billing/test -p 'test_*.py' -v
          python3 -m unittest discover -s packages/rebuild-ai3/test -p 'test_*.py' -v
      - name: Existing requirements validation (25 seeds + source heading inventory)
        run: |
          npm run ssot:validate
          node docs/requirements/verify-original-inventory.mjs
