name: Rebuild Requirements Gate
on:
  pull_request:
    paths:
      - 'docs/requirements/**'
      - 'docs/adr/**'
      - '.github/workflows/rebuild-requirements.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SSOT registry
        run: node docs/requirements/validate.mjs
