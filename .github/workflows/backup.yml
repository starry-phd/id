name: Weekly D1 backup

# Spec S-PLT-08: D1 Time Travel is the primary restore path; this adds a weekly
# export of the production identity database to the private R2 bucket
# "starry-backups". Restoring production always needs the owner's approval.
on:
  schedule:
    # Sundays 04:41 Taiwan time (Saturday 20:41 UTC), a quiet hour; export briefly blocks queries.
    - cron: '41 20 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare secrets not configured; backup skipped."; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - if: steps.gate.outputs.enabled == 'true'
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Export and upload
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          npx wrangler d1 export starry-identity --remote --output "identity-${stamp}.sql"
          gzip -9 "identity-${stamp}.sql"
          npx wrangler r2 object put "starry-backups/identity/identity-${stamp}.sql.gz" --file "identity-${stamp}.sql.gz" --remote
          echo "Uploaded identity/identity-${stamp}.sql.gz ($(stat -c %s "identity-${stamp}.sql.gz") bytes)"
          rm -f "identity-${stamp}.sql.gz"
